name: Application CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: boutique-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  GITOPS_REPOSITORY: Prashant0110/google-boutique-gitops
  GITOPS_BRANCH: feat/apex-assessment

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      paymentservice: ${{ steps.filter.outputs.paymentservice }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - '*.go'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - '.dockerignore'
              - 'templates/**'
              - 'static/**'
              - '.github/workflows/**'
            paymentservice:
              - 'paymentservice/**'
              - '.github/workflows/**'

  frontend:
    name: Test, build, scan and publish frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      IMAGE_REPOSITORY: boutique-frontend
      IMAGE_TAG: ${{ github.sha }}
      LOCAL_IMAGE: boutique-frontend:${{ github.sha }}

    outputs:
      image_tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export image tag
        id: image
        run: echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go dependencies
        run: go mod download

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Build frontend image
        run: docker build -t "$LOCAL_IMAGE" .

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publish frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          REMOTE_IMAGE="$REGISTRY/$IMAGE_REPOSITORY:$IMAGE_TAG"

          if aws ecr describe-images \
            --repository-name "$IMAGE_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" >/dev/null 2>&1; then
            echo "This image tag already exists; not overwriting it."
          else
            docker tag "$LOCAL_IMAGE" "$REMOTE_IMAGE"
            docker push "$REMOTE_IMAGE"
          fi

  paymentservice:
    name: Test, build, scan and publish paymentservice
    needs: changes
    if: needs.changes.outputs.paymentservice == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      IMAGE_REPOSITORY: boutique-paymentservice
      IMAGE_TAG: ${{ github.sha }}
      LOCAL_IMAGE: boutique-paymentservice:${{ github.sha }}

    outputs:
      image_tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export image tag
        id: image
        run: echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: paymentservice/package-lock.json

      - name: Install dependencies
        working-directory: paymentservice
        run: npm ci

      - name: Audit dependencies
        working-directory: paymentservice
        run: npm audit --audit-level=high

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find paymentservice -type f -name '*.js' -print0 |
            xargs -0 -r -n1 node --check

      - name: Build paymentservice image
        run: docker build -f paymentservice/Dockerfile -t "$LOCAL_IMAGE" paymentservice

      - name: Scan paymentservice image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publish paymentservice image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          REMOTE_IMAGE="$REGISTRY/$IMAGE_REPOSITORY:$IMAGE_TAG"

          if aws ecr describe-images \
            --repository-name "$IMAGE_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" >/dev/null 2>&1; then
            echo "This image tag already exists; not overwriting it."
          else
            docker tag "$LOCAL_IMAGE" "$REMOTE_IMAGE"
            docker push "$REMOTE_IMAGE"
          fi

  promote:
    name: Create GitOps promotion pull request
    needs: [changes, frontend, paymentservice]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.paymentservice.result == 'success' || needs.paymentservice.result == 'skipped') &&
      (needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.paymentservice == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update changed service image tags
        env:
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          PAYMENT_CHANGED: ${{ needs.changes.outputs.paymentservice }}
          FRONTEND_TAG: ${{ needs.frontend.outputs.image_tag }}
          PAYMENT_TAG: ${{ needs.paymentservice.outputs.image_tag }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path("gitops/helm/apps")
          registry = (
              f"{os.environ['AWS_ACCOUNT_ID']}.dkr.ecr."
              f"{os.environ['AWS_REGION']}.amazonaws.com"
          )

          def update_values(relative_path, repository, tag):
              path = root / relative_path
              lines = path.read_text().splitlines(keepends=True)

              start = next(
                  (i for i, line in enumerate(lines)
                   if line.strip() == "image:" and not line[:1].isspace()),
                  None,
              )
              if start is None:
                  raise SystemExit(f"Top-level image block not found in {path}")

              end = start + 1
              while end < len(lines):
                  if lines[end].strip() and not lines[end][:1].isspace():
                      break
                  end += 1

              found_repository = False
              found_tag = False

              for i in range(start + 1, end):
                  stripped = lines[i].lstrip()
                  indent = lines[i][:len(lines[i]) - len(stripped)]

                  if stripped.startswith("repository:"):
                      lines[i] = f"{indent}repository: {repository}\n"
                      found_repository = True
                  elif stripped.startswith("tag:"):
                      lines[i] = f"{indent}tag: {tag}\n"
                      found_tag = True

              if not found_repository or not found_tag:
                  raise SystemExit(f"Image repository/tag missing in {path}")

              path.write_text("".join(lines))
              print(f"Updated {path} to {repository}:{tag}")

          if os.environ["FRONTEND_CHANGED"] == "true":
              update_values(
                  "frontend/values.yaml",
                  f"{registry}/boutique-frontend",
                  os.environ["FRONTEND_TAG"],
              )

          if os.environ["PAYMENT_CHANGED"] == "true":
              update_values(
                  "paymentservice/values.yaml",
                  f"{registry}/boutique-paymentservice",
                  os.environ["PAYMENT_TAG"],
              )
          PY

      - name: Create GitOps pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          base: ${{ env.GITOPS_BRANCH }}
          branch: ci/promote-${{ github.sha }}
          delete-branch: true
          commit-message: "ci: promote images from ${{ github.sha }}"
          title: "ci: promote images from ${{ github.sha }}"
          body: |
            Automated image promotion from the application repository.

            Application commit: `${{ github.sha }}`

            Review the image tags and merge this pull request to let Argo CD
            reconcile the GitOps branch.
